<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Poop Bagel</title>
<style>
  :root { --bg:#fff7e8; --ink:#4a2c12; --btn:#8b5a2b; --btnInk:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; touch-action:none; }
  h1 { margin:4px 0 2px; font-size:clamp(26px,6vw,44px); }
  p.sub { margin:0 0 10px; opacity:.75; text-align:center; }
  canvas { width:min(92vw,520px); height:min(92vw,520px); border-radius:24px; background:#fdebd0;
           box-shadow:0 6px 20px rgba(74,44,18,.25); cursor:crosshair; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 0; max-width:540px; }
  button { font:inherit; font-size:16px; border:0; border-radius:999px; padding:10px 16px; background:var(--btn); color:var(--btnInk);
           cursor:pointer; box-shadow:0 3px 0 #5a3816; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #5a3816; }
  button.on { background:#c9822f; outline:3px solid #4a2c12; }
  #meter { width:min(92vw,520px); height:22px; background:#f1d9b5; border-radius:999px; overflow:hidden; border:2px solid var(--ink); }
  #fill { height:100%; width:0; background:linear-gradient(90deg,#7a4a1e,#5a3312); transition:width .15s; }
  #msg { min-height:1.5em; font-size:20px; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <h1>💩 Poop Bagel 🥯</h1>
  <p class="sub">Drag on the bagel to shmear. Get full coverage. Don't ask why.</p>
  <canvas id="c" width="1040" height="1040"></canvas>
  <div class="bar">
    <button data-tool="knife" class="on">🔪 Shmear</button>
    <button data-tool="corn">🌽 Corn bits</button>
    <button data-tool="fly">🪰 Flies</button>
    <button id="stink">💨 Stink: off</button>
    <button id="reset">🥯 New bagel</button>
  </div>
  <div id="meter"><div id="fill"></div></div>
  <div id="msg">0% shmeared</div>

<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const W = c.width, CX = W/2, CY = W/2, R_OUT = W*0.40, R_IN = W*0.12;
// offscreen layer for shmear (clipped to bagel)
const shmear = document.createElement('canvas'); shmear.width = shmear.height = W;
const sctx = shmear.getContext('2d');
let tool = 'knife', stink = false, toppings = [], flies = [], last = null, celebrated = false;
let seeds = [];

function rand(a,b){ return a + Math.random()*(b-a); }
function onBagel(x,y){ const d = Math.hypot(x-CX,y-CY); return d < R_OUT*0.97 && d > R_IN*1.05; }

function makeSeeds(){
  seeds = [];
  for (let i=0;i<140;i++){
    const a = rand(0,Math.PI*2), r = rand(R_IN*1.25, R_OUT*0.92);
    seeds.push({x:CX+Math.cos(a)*r, y:CY+Math.sin(a)*r, rot:rand(0,Math.PI), kind: Math.random()<.6?'sesame':'poppy'});
  }
}

function drawBagel(){
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(CX+14, CY+22, R_OUT, R_OUT*0.98, 0, 0, Math.PI*2); ctx.fill();
  // body
  const g = ctx.createRadialGradient(CX-R_OUT*.3, CY-R_OUT*.35, R_IN, CX, CY, R_OUT);
  g.addColorStop(0,'#f2c27a'); g.addColorStop(.6,'#d9973f'); g.addColorStop(1,'#a8631f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(CX,CY,R_OUT,0,Math.PI*2); ctx.arc(CX,CY,R_IN,0,Math.PI*2,true); ctx.fill('evenodd');
  // inner cut-face ring (lighter, it's sliced)
  const g2 = ctx.createRadialGradient(CX,CY,R_IN,CX,CY,R_OUT*0.93);
  g2.addColorStop(0,'#f7dfb0'); g2.addColorStop(1,'#f0cf92');
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(CX,CY,R_OUT*0.93,0,Math.PI*2); ctx.arc(CX,CY,R_IN*1.12,0,Math.PI*2,true); ctx.fill('evenodd');
  // bread pores
  ctx.fillStyle = 'rgba(190,140,70,.35)';
  for (const s of seeds){ ctx.beginPath(); ctx.ellipse(s.x, s.y, 5, 3, s.rot, 0, Math.PI*2); ctx.fill(); }
  // crust rim outline
  ctx.strokeStyle = '#7d4613'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(CX,CY,R_OUT,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,R_IN,0,Math.PI*2); ctx.stroke();
}

function clipBagel(g){
  g.beginPath(); g.arc(CX,CY,R_OUT*0.97,0,Math.PI*2); g.arc(CX,CY,R_IN*1.05,0,Math.PI*2,true); g.clip('evenodd');
}

function smear(x0,y0,x1,y1){
  sctx.save(); clipBagel(sctx);
  const dist = Math.hypot(x1-x0,y1-y0), steps = Math.max(1, Math.ceil(dist/6));
  for (let i=0;i<=steps;i++){
    const t = i/steps, x = x0+(x1-x0)*t, y = y0+(y1-y0)*t;
    const r = rand(34,48);
    const g = sctx.createRadialGradient(x-r*.3,y-r*.3,2,x,y,r);
    const base = [rand(85,110)|0, rand(52,66)|0, rand(18,28)|0];
    g.addColorStop(0, `rgba(${base[0]+40},${base[1]+30},${base[2]+15},.95)`);
    g.addColorStop(.55, `rgba(${base[0]},${base[1]},${base[2]},.9)`);
    g.addColorStop(1, `rgba(${base[0]-30},${base[1]-20},${base[2]-8},0)`);
    sctx.fillStyle = g;
    sctx.beginPath(); sctx.arc(x+rand(-4,4),y+rand(-4,4),r,0,Math.PI*2); sctx.fill();
  }
  // knife streaks for texture
  sctx.strokeStyle = 'rgba(160,110,60,.35)'; sctx.lineWidth = 3; sctx.lineCap = 'round';
  for (let k=-2;k<=2;k++){
    const nx = -(y1-y0)/(dist||1), ny = (x1-x0)/(dist||1);
    sctx.beginPath(); sctx.moveTo(x0+nx*k*10, y0+ny*k*10); sctx.lineTo(x1+nx*k*10, y1+ny*k*10); sctx.stroke();
  }
  sctx.restore();
}

function coverage(){
  const d = sctx.getImageData(0,0,W,W).data; let hit=0, tot=0;
  for (let y=0;y<W;y+=8) for (let x=0;x<W;x+=8){
    if (!onBagel(x,y)) continue; tot++;
    if (d[(y*W+x)*4+3] > 120) hit++;
  }
  return tot ? hit/tot : 0;
}

function addCorn(x,y){ if (onBagel(x,y)) toppings.push({x,y,rot:rand(0,Math.PI)}); }
function addFly(x,y){ flies.push({x,y,ax:x,ay:y,ph:rand(0,6.28),sp:rand(1.5,3)}); }

function drawCorn(t){
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.rot);
  ctx.fillStyle = '#f7d23a'; ctx.strokeStyle = '#b8901a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10,-8); ctx.quadraticCurveTo(0,-16,10,-8); ctx.lineTo(8,10); ctx.quadraticCurveTo(0,14,-8,10); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.restore();
}
function drawFly(f, time){
  f.x = f.ax + Math.cos(time*f.sp/1000+f.ph)*40 + Math.sin(time/170+f.ph)*8;
  f.y = f.ay + Math.sin(time*f.sp*1.3/1000+f.ph)*28 + Math.cos(time/130+f.ph)*8;
  ctx.save(); ctx.translate(f.x,f.y);
  const flap = Math.sin(time/25)*0.6;
  ctx.fillStyle = 'rgba(200,230,255,.7)';
  ctx.save(); ctx.rotate(-0.6+flap); ctx.beginPath(); ctx.ellipse(-8,-10,9,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(0.6-flap); ctx.beginPath(); ctx.ellipse(8,-10,9,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.ellipse(0,0,7,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(-4,-8,3,0,7); ctx.arc(4,-8,3,0,7); ctx.fill();
  ctx.restore();
}
function drawStink(time){
  ctx.strokeStyle = 'rgba(110,150,40,.55)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (let i=0;i<5;i++){
    const bx = CX - 220 + i*110, phase = (time/1400 + i*.37) % 1;
    const by = CY - R_OUT*0.3 - phase*260;
    ctx.globalAlpha = 1 - phase;
    ctx.beginPath();
    for (let k=0;k<=20;k++){ const yy = by - k*6, xx = bx + Math.sin(k/3 + time/300 + i)*14; k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function render(time){
  ctx.clearRect(0,0,W,W);
  drawBagel();
  ctx.drawImage(shmear,0,0);
  toppings.forEach(drawCorn);
  if (stink) drawStink(time);
  flies.forEach(f=>drawFly(f,time));
  requestAnimationFrame(render);
}

function pos(e){ const r = c.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*W/r.height}; }
let covTimer = 0;
function updateMeter(){
  const p = Math.round(coverage()*100);
  document.getElementById('fill').style.width = p+'%';
  const m = document.getElementById('msg');
  if (p >= 92 && !celebrated){ celebrated = true; m.textContent = '🏆 ' + p + '% — A MASTERPIECE. Your mother would be horrified.'; if(!stink) toggleStink(); for(let i=0;i<6;i++) addFly(rand(200,840),rand(200,840)); }
  else if (!celebrated) m.textContent = p + '% shmeared' + (p>60?' — keep going, you sicko':p>25?' — nice spread':'');
}
c.addEventListener('pointerdown', e=>{
  c.setPointerCapture(e.pointerId); const p = pos(e);
  if (tool==='knife'){ last = p; smear(p.x,p.y,p.x,p.y); }
  else if (tool==='corn') addCorn(p.x,p.y);
  else addFly(p.x,p.y);
});
c.addEventListener('pointermove', e=>{
  if (!last) return; const p = pos(e); smear(last.x,last.y,p.x,p.y); last = p;
  clearTimeout(covTimer); covTimer = setTimeout(updateMeter, 60);
});
const end = ()=>{ if (last){ last = null; updateMeter(); } };
c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  tool = b.dataset.tool; document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on', x===b));
});
function toggleStink(){ stink = !stink; document.getElementById('stink').textContent = '💨 Stink: ' + (stink?'on':'off'); }
document.getElementById('stink').onclick = toggleStink;
document.getElementById('reset').onclick = ()=>{
  sctx.clearRect(0,0,W,W); toppings=[]; flies=[]; celebrated=false; if(stink) toggleStink(); makeSeeds(); updateMeter();
};
makeSeeds(); requestAnimationFrame(render);
</script>
</body>
</html>
